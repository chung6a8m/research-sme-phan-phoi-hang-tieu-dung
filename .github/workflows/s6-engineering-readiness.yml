name: S6 engineering readiness plan checks (NOT product E2E)
on:
  pull_request:
    paths:
      - 'briefs/2026-11-14-11-s6-engineering-readiness.md'
      - 'reports/2026-11-14-11-s6-engineering-readiness/**'
      - '.github/workflows/s6-engineering-readiness.yml'
  workflow_dispatch:
jobs:
  plan-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source decision and S6 plan (no runtime)
        run: node reports/2026-11-14-11-s6-engineering-readiness/s6-readiness-validation.mjs --self-test
      - name: Negative checks for signed R metadata only
        run: node reports/2026-11-14-11-s6-engineering-readiness/s6-owner-acceptance-audit.mjs --self-test
      - name: Authenticate signed R using actual read-only GitHub metadata
        run: node reports/2026-11-14-11-s6-engineering-readiness/s6-owner-acceptance-audit.mjs --github
        env:
          GITHUB_TOKEN: ${{ github.token }}
